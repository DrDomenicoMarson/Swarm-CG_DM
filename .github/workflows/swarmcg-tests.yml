name: swarm-cg-tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable ".[dev]"
      - run: python -m pytest --cov=swarmcg --cov-report=term-missing tests --ignore=tests/integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable ".[dev]"
      - run: python -m ruff check swarmcg tests

  wheel-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -c "import swarmcg; print(swarmcg.__version__)"
      - run: scg_evaluate --help
      - run: scg_optimize --help
      - run: scg_monitor --help

  gromacs-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2025.4"
            gromacs-spec: "gromacs=2025.4"
          - label: "current"
            gromacs-spec: "gromacs"
    name: GROMACS ${{ matrix.label }} integration
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: swarmcg-ci
          create-args: >-
            python=3.13
            ${{ matrix.gromacs-spec }}
            pip
      - name: Install package and test dependencies
        shell: bash -el {0}
        run: python -m pip install --editable . pytest
      - name: Report GROMACS version
        shell: bash -el {0}
        run: gmx --version
      - name: Run real GROMACS integration tests
        shell: bash -el {0}
        run: python -m pytest tests/integration/test_gromacs_integration.py
